---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xibo-mysql
spec:
  chartRef:
    kind: OCIRepository
    name: xibo
  interval: 1h
  values:
    controllers:
      xibo-mysql:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/mysql
              # Must match xibosignage/xibo-docker (MySQL 8.4 LTS). Do not use Renovate bumps here.
              tag: "8.4"
            env:
              MYSQL_DATABASE: cms
              MYSQL_USER: cms
            envFrom:
              - secretRef:
                  name: xibo-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3306
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: xibo-mysql
        forceRename: xibo-mysql
        ports:
          mysql:
            port: 3306
    persistence:
      data:
        existingClaim: xibo-mysql
        globalMounts:
          - path: /var/lib/mysql
