---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: xibo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: xibo-secret
    creationPolicy: Owner
    template:
      data:
        MYSQL_PASSWORD: "{{ .MYSQL_PASSWORD }}"
        MYSQL_ROOT_PASSWORD: "{{ .MYSQL_ROOT_PASSWORD }}"
        CMS_SMTP_FROM: "{{ .SMTP_FROM }}"
  dataFrom:
    - extract:
        key: xibo
    - extract:
        key: smtp-relay
