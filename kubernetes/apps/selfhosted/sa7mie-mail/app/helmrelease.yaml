---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sa7mie-mail
spec:
  chartRef:
    kind: OCIRepository
    name: sa7mie-mail
  interval: 1h
  values:
    controllers:
      sa7mie-mail:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          bootstrap-tls:
            image:
              repository: docker.io/library/alpine
              tag: "3.21"
            command:
              - sh
              - -c
              - |
                apk add --no-cache openssl >/dev/null
                mkdir -p /data/tls
                if [ ! -f /data/tls/privkey.pem ]; then
                  openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                    -keyout /data/tls/privkey.pem \
                    -out /data/tls/fullchain.pem \
                    -subj "/CN=mail.sa7mie.se"
                  echo "Created bootstrap self-signed TLS cert in /data/tls"
                fi
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: ghcr.io/foxcpp/maddy
              tag: 0.9.5@sha256:de42151adff6388edb5e4ee88f60334fa1ab85e309485193ecb1c2db20203315
            env:
              MADDY_DOMAIN: sa7mie.se
              MADDY_HOSTNAME: mail.sa7mie.se
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &smtp 25
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *smtp
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *smtp
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: sa7mie-mail
        forceRename: sa7mie-mail
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.20.144
        externalTrafficPolicy: Local
        ports:
          smtp:
            port: 25
            targetPort: 25
          submission:
            port: 587
            targetPort: 587
          imaps:
            port: 993
            targetPort: 993
    configMaps:
      config:
        data:
          maddy.conf: |-
            $(hostname) = {env:MADDY_HOSTNAME}
            $(primary_domain) = {env:MADDY_DOMAIN}
            $(local_domains) = $(primary_domain)

            tls file /data/tls/fullchain.pem /data/tls/privkey.pem

            auth.pass_table local_authdb {
              table sql_table {
                driver sqlite3
                dsn credentials.db
                table_name passwords
              }
            }

            storage.imapsql local_mailboxes {
              driver sqlite3
              dsn imapsql.db
            }

            hostname $(hostname)

            table.chain local_rewrites {
              optional_step regexp "(.+)\+(.+)@(.+)" "$1@$3"
              optional_step static {
                entry postmaster postmaster@$(primary_domain)
              }
              optional_step file /etc/maddy/aliases
            }

            msgpipeline local_routing {
              destination postmaster $(local_domains) {
                modify {
                  replace_rcpt &local_rewrites
                }
                deliver_to &local_mailboxes
              }
              default_destination {
                reject 550 5.1.1 "User doesn't exist"
              }
            }

            smtp tcp://0.0.0.0:25 {
              limits {
                all rate 20 1s
                all concurrency 10
              }
              dmarc yes
              check {
                require_mx_record
                dkim
                spf
              }
              source $(local_domains) {
                reject 501 5.1.8 "Use Submission for outgoing SMTP"
              }
              default_source {
                destination postmaster $(local_domains) {
                  deliver_to &local_routing
                }
                default_destination {
                  reject 550 5.1.1 "User doesn't exist"
                }
              }
            }

            submission tls://0.0.0.0:465 tcp://0.0.0.0:587 {
              limits {
                all rate 50 1s
              }
              auth &local_authdb
              source $(local_domains) {
                check {
                  authorize_sender {
                    prepare_email &local_rewrites
                    user_to_email identity
                  }
                }
                destination postmaster $(local_domains) {
                  deliver_to &local_routing
                }
                default_destination {
                  modify {
                    dkim $(primary_domain) $(local_domains) default
                  }
                  deliver_to &remote_queue
                }
              }
              default_source {
                reject 501 5.1.8 "Non-local sender domain"
              }
            }

            target.remote outbound_delivery {
              limits {
                destination rate 20 1s
                destination concurrency 10
              }
              mx_auth {
                dane
                mtasts {
                  cache fs
                  fs_dir mtasts_cache/
                }
                local_policy {
                  min_tls_level encrypted
                  min_mx_level none
                }
              }
            }

            target.queue remote_queue {
              target &outbound_delivery
              autogenerated_msg_domain $(primary_domain)
              bounce {
                destination postmaster $(local_domains) {
                  deliver_to &local_routing
                }
                default_destination {
                  reject 550 5.0.0 "Refusing to send DSNs to non-local addresses"
                }
              }
            }

            imap tls://0.0.0.0:993 tcp://0.0.0.0:143 {
              auth &local_authdb
              storage &local_mailboxes
            }
    persistence:
      data:
        existingClaim: sa7mie-mail
        globalMounts:
          - path: /data
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /data/maddy.conf
            subPath: maddy.conf
