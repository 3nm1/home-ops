---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stirling
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stirling-secret
    creationPolicy: Owner
    template:
      data:
        SECURITY_INITIALLOGIN_USERNAME: "{{ .SECRET_STIRLING_PDF_USERNAME }}"
        SECURITY_INITIALLOGIN_PASSWORD: "{{ .SECRET_STIRLING_PDF_PASSWORD }}"
  dataFrom:
    - extract:
        key: stirling
