---
# RomM emulator streaming: PCSX2 (PS2) via linuxserver/webstation:romm.
# Shares ROM NFS with RomM; broker auth uses romm-secret (STREAMING_BROKER_SECRET).
# Default: CPU streaming on srv-talos04 (no nvidia.com/gpu) so Jellyfin can keep the GPU.
# For GPU PCSX2: scale Jellyfin to 0, uncomment nvidia limits + runtimeClassName below, reconcile.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm-webstation
spec:
  chartRef:
    kind: OCIRepository
    name: romm-streaming
  interval: 1h
  values:
    controllers:
      romm-webstation:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/webstation
              tag: romm
            env:
              TZ: Europe/Stockholm
              PUID: "1000"
              PGID: "1000"
              SUBFOLDER: /streaming/
              AUTO_GPU: "false"
              BROKER_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: STREAMING_BROKER_SECRET
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 8Gi
                # nvidia.com/gpu: 1
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: srv-talos04
      tolerations:
        - key: media.engstrom.live/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      # runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: romm-webstation
        forceRename: romm-webstation
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["romm-stream.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: romm-webstation-config
        globalMounts:
          - path: /config
      library:
        type: nfs
        server: 192.168.20.20
        path: /mnt/Backup/roms
        globalMounts:
          - path: /romm/library
            readOnly: true
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm