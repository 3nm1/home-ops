---
# RomM emulator streaming: PCSX2 (PS2) via linuxserver/webstation:romm.
# Shares ROM NFS with RomM; broker auth uses romm-secret (STREAMING_BROKER_SECRET).
# The GPU operator does not time-slice or use MPS, so nvidia.com/gpu is exclusive.
# This pod owns the card on srv-talos04. Jellyfin stays on that node for CPU transcode.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm-webstation
spec:
  chartRef:
    kind: OCIRepository
    name: romm-streaming
  interval: 1h
  timeout: 20m
  values:
    controllers:
      romm-webstation:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/webstation
              tag: romm
            env:
              TZ: Europe/Stockholm
              LANG: sv_SE.UTF-8
              LC_ALL: sv_SE.UTF-8
              PUID: "1000"
              PGID: "1000"
              SUBFOLDER: /streaming/
              # true: use the first GPU the NVIDIA runtime mounts. false disables it.
              AUTO_GPU: "true"
              BROKER_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: STREAMING_BROKER_SECRET
            # app-template defaults runAsNonRoot/1000; Selkies/nginx init must run as root.
            securityContext:
              privileged: true
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 8Gi
                nvidia.com/gpu: 1
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: srv-talos04
      tolerations:
        - key: media.engstrom.live/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      runtimeClassName: nvidia
      # LinuxServer s6 init (same pattern as bookstack).
      securityContext:
        runAsUser: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: romm-webstation
        forceRename: romm-webstation
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["romm-stream.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: romm-webstation-config
        globalMounts:
          - path: /config
      library:
        type: nfs
        server: 192.168.20.20
        path: /mnt/Backup/roms
        globalMounts:
          - path: /romm/library
            readOnly: true
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm