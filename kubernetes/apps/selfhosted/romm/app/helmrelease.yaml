---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
spec:
  chartRef:
    kind: OCIRepository
    name: romm
  interval: 1h
  values:
    controllers:
      romm:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          wait-for-mariadb:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - until nc -z romm-mariadb 3306; do echo waiting for mariadb; sleep 2; done
        containers:
          app:
            image:
              repository: rommapp/romm
              tag: 5.4.1
            env:
              TZ: Europe/Stockholm
              ROMM_DB_DRIVER: mariadb
              DB_HOST: romm-mariadb
              DB_PORT: "3306"
              DB_NAME: romm
              DB_USER: romm-user
              ROMM_BASE_URL: https://romm.${SECRET_DOMAIN}
              ROMM_PORT: "8080"
              SCAN_WORKERS: "4"
              WEB_SERVER_CONCURRENCY: "4"
              HASHEOUS_API_ENABLED: "true"
              # OIDC: set OIDC_ENABLED=true after Authentik provider + 1Password fields
              OIDC_ENABLED: "false"
              OIDC_PROVIDER: authentik
              OIDC_REDIRECT_URI: https://romm.${SECRET_DOMAIN}/api/oauth/openid
              OIDC_SERVER_APPLICATION_URL: https://auth.${SECRET_DOMAIN}/application/o/romm/
            envFrom:
              - secretRef:
                  name: romm-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsUser: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: romm
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["romm.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      resources:
        existingClaim: romm-resources
        globalMounts:
          - path: /romm/resources
      redis:
        existingClaim: romm-redis
        globalMounts:
          - path: /redis-data
      assets:
        existingClaim: romm-assets
        globalMounts:
          - path: /romm/assets
      config:
        existingClaim: romm-config
        globalMounts:
          - path: /romm/config
      # Create /mnt/Backup/roms on TrueNAS (or adjust path) before first scan
      library:
        type: nfs
        server: 192.168.20.20
        path: /mnt/Backup/roms
        globalMounts:
          - path: /romm/library
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
