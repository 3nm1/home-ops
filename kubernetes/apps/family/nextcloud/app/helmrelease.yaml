---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: nextcloud
      version: 9.2.2
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      security:
        allowInsecureImages: true

    image:
      flavor: apache

    replicaCount: 1

    httpRoute:
      enabled: true
      hostnames:
        - cloud.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
        - name: envoy-external
          namespace: network
          sectionName: https
      wellKnown:
        enabled: true
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: "/"
          filters:
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                set:
                  - name: Strict-Transport-Security
                    value: "max-age=15552000; includeSubDomains"

    ingress:
      enabled: false

    phpClientHttpsFix:
      enabled: true
      protocol: https

    nextcloud:
      host: cloud.${SECRET_DOMAIN}
      username: admin
      existingSecret:
        enabled: true
        secretName: nextcloud-secret
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
      persistence:
        trustedDomains:
          - cloud.${SECRET_DOMAIN}
      strategy:
        type: Recreate
      podSecurityContext:
        fsGroup: 33
      extraEnv:
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nextcloud-secret
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-secret
              key: OIDC_CLIENT_SECRET
        - name: OIDC_DISCOVERY_URI
          value: https://auth.${SECRET_DOMAIN}/application/o/nextcloud/.well-known/openid-configuration
        - name: SMTP_FROM
          valueFrom:
            secretKeyRef:
              name: nextcloud-secret
              key: SMTP_FROM
      configs:
        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'overwritehost' => 'cloud.${SECRET_DOMAIN}',
            'overwriteprotocol' => 'https',
            'overwrite.cli.url' => 'https://cloud.${SECRET_DOMAIN}',
            'trusted_proxies' => array(
              0 => '10.0.0.0/8',
              1 => '172.16.0.0/12',
              2 => '192.168.0.0/16',
            ),
            'allow_local_remote_servers' => true,
          );
        oidc.config.php: |-
          <?php
          $CONFIG = array (
            'user_oidc' => array(
              'default_token_endpoint_auth_method' => 'client_secret_post',
            ),
          );
        security.config.php: |-
          <?php
          $CONFIG = array (
            'maintenance_window_start' => 3,
            'default_phone_region' => 'SE',
            'instanceid' => 'f4e8b2c1-9d3a-4f6e-8b7c-1a2d3e4f5a6b',
          );
      hooks:
        before-starting: |-
          #!/bin/bash
          set -uo pipefail
          occ() { run_as www-data php occ "$@"; }
          if ! occ app:list 2>/dev/null | grep -q 'user_oidc'; then
            occ app:install user_oidc || echo "WARN: user_oidc install failed, continuing startup"
          fi
          occ app:enable user_oidc || echo "WARN: user_oidc enable failed, continuing startup"
          if [ -n "$${OIDC_CLIENT_ID:-}" ] && [ -n "$${OIDC_CLIENT_SECRET:-}" ] && [ -n "$${OIDC_DISCOVERY_URI:-}" ]; then
            occ user_oidc:provider authentik \
              --clientid="$${OIDC_CLIENT_ID}" \
              --clientsecret="$${OIDC_CLIENT_SECRET}" \
              --discoveryuri="$${OIDC_DISCOVERY_URI}" \
              || echo "WARN: user_oidc provider setup failed, continuing startup"
            occ config:app:set --type=string --value=0 user_oidc allow_multiple_user_backends \
              || echo "WARN: user_oidc config failed, continuing startup"
          fi
          if [ -n "$${SMTP_FROM:-}" ]; then
            mail_local="$${SMTP_FROM%%@*}"
            mail_domain="$${SMTP_FROM#*@}"
            occ config:system:set mail_smtpmode --value=smtp || true
            occ config:system:set mail_smtphost --value=smtp-relay.selfhosted.svc.cluster.local || true
            occ config:system:set mail_smtpport --value=25 --type=integer || true
            occ config:system:set mail_smtpsecure --value= || true
            occ config:system:set mail_smtpauth --value=0 --type=integer || true
            occ config:system:set mail_from_address --value="$${mail_local}" || true
            occ config:system:set mail_domain --value="$${mail_domain}" || true
          fi
          exit 0
        post-installation: |-
          #!/bin/bash
          set -euo pipefail
          occ() { run_as www-data php occ "$@"; }
          occ background:cron
          occ maintenance:repair --include-expensive || true
        post-upgrade: |-
          #!/bin/bash
          set -euo pipefail
          occ() { run_as www-data php occ "$@"; }
          occ background:cron
          occ maintenance:repair --include-expensive || true
      extraInitContainers:
        - name: fix-nfs-data-permissions
          image: docker.io/library/busybox:1.38
          command:
            - sh
            - -c
            - |
              mkdir -p /var/www/html/data
              chown -R 33:33 /var/www/html/data
              chmod 750 /var/www/html/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html/data
              subPath: data

    internalDatabase:
      enabled: false

    postgresql:
      enabled: true
      image:
        registry: docker.io
        repository: bitnamilegacy/postgresql
      global:
        postgresql:
          auth:
            username: nextcloud
            database: nextcloud
            existingSecret: nextcloud-secret
            secretKeys:
              adminPasswordKey: postgres-password
              userPasswordKey: password
      primary:
        persistence:
          enabled: true
          existingClaim: nextcloud-postgresql

    mariadb:
      enabled: false

    redis:
      enabled: true
      architecture: standalone
      image:
        registry: docker.io
        repository: bitnamilegacy/redis
      auth:
        enabled: true
        existingSecret: nextcloud-secret
        existingSecretPasswordKey: redis-password
      master:
        persistence:
          enabled: false

    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        schedule: "*/5 * * * *"
        securityContext:
          runAsUser: 33
          runAsGroup: 33
          runAsNonRoot: true
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - nextcloud
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - app
                topologyKey: kubernetes.io/hostname

    collabora:
      enabled: false

    persistence:
      enabled: true
      existingClaim: nextcloud
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data

    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 36

    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5

    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
