---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  timeout: 15m
  values:
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      create: true
      # Talos: no in-cluster apiserver metrics scrape — absent(up{job="apiserver"}) false-positives.
      disabled:
        KubeAPIDown: true
        NodeSystemSaturation: true
      # srv-talos03 (px-node03): higher load threshold — CP + weak host, soft-tainted for scheduling.
      custom:
        groups:
          - name: homelab-node
            rules:
              - alert: NodeSystemSaturation
                expr: |-
                  (
                    node_load1{job="node-exporter"}
                    / count without (cpu, mode) (node_cpu_seconds_total{job="node-exporter", mode="idle"})
                  )
                  > (
                    4
                    and on (instance)
                    label_replace(node_uname_info{job="node-exporter", nodename="srv-talos03"}, "instance", "$1", "instance", "(.*)")
                  )
                  or (
                    node_load1{job="node-exporter"}
                    / count without (cpu, mode) (node_cpu_seconds_total{job="node-exporter", mode="idle"})
                  )
                  > (
                    2
                    unless on (instance)
                    label_replace(node_uname_info{job="node-exporter", nodename="srv-talos03"}, "instance", "$1", "instance", "(.*)")
                  )
                for: 20m
                labels:
                  severity: warning
                annotations:
                  description: >-
                    System load per core at {{ $labels.instance }} has been above the
                    homelab threshold for 20 minutes (currently
                    {{ printf "%.2f" $value }}).
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodesystemsaturation
                  summary: System saturated, load per core is very high.
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal:
              - namespace
              - alertname
        route:
          receiver: "null"
          group_by:
            - namespace
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - receiver: "null"
              matchers:
                - alertname = Watchdog
            - receiver: "null"
              matchers:
                - alertname = InfoInhibitor
            - receiver: "null"
              matchers:
                - severity = info
            - receiver: "null"
              matchers:
                - alertname = CPUThrottlingHigh
            - receiver: "null"
              matchers:
                - alertname = KubeAPIDown
            - receiver: discord
              matchers:
                - severity =~ critical|warning
        receivers:
          - name: "null"
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager/secrets/alertmanager-notifications/discord-webhook-url
                send_resolved: true
      alertmanagerSpec:
        affinity: &avoidTalos03
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - srv-talos03
        secrets:
          - alertmanager-notifications
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
    grafana:
      enabled: true
      affinity: *avoidTalos03
      deploymentStrategy:
        type: Recreate
      initChownData:
        enabled: false
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      grafana.ini:
        server:
          root_url: https://grafana.${SECRET_DOMAIN}
          domain: grafana.${SECRET_DOMAIN}
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 2Gi
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
        datasources:
          enabled: true
      additionalDataSources:
        - name: Loki (srv-syslog01)
          type: loki
          uid: loki-syslog
          url: http://srv-syslog01.lab.engstrom.live:3100
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 1000
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kube-state-metrics:
      prometheus:
        monitor:
          enabled: true
    prometheus:
      prometheusSpec:
        affinity: *avoidTalos03
        # Used in alert GeneratorURL (Discord "Source") — must match HTTPRoute hostname.
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        externalLabels:
          cluster: kubernetes
        enableAdminAPI: true
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        retention: 7d
        retentionSize: 18GB
        walCompression: true
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 200m
            memory: 1536Mi
          limits:
            memory: 3Gi
    prometheus-node-exporter:
      prometheus:
        monitor:
          enabled: true
