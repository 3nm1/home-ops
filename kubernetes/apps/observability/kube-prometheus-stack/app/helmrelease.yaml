---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  timeout: 15m
  values:
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      create: true
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal:
              - namespace
              - alertname
        route:
          receiver: "null"
          group_by:
            - namespace
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - receiver: "null"
              matchers:
                - alertname = Watchdog
            - receiver: "null"
              matchers:
                - alertname = InfoInhibitor
            - receiver: "null"
              matchers:
                - severity = info
            - receiver: "null"
              matchers:
                - alertname = CPUThrottlingHigh
            - receiver: discord
              matchers:
                - severity =~ critical|warning
        receivers:
          - name: "null"
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager/secrets/alertmanager-notifications/discord-webhook-url
                send_resolved: true
      alertmanagerSpec:
        secrets:
          - alertmanager-notifications
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
    grafana:
      enabled: true
      deploymentStrategy:
        type: Recreate
      initChownData:
        enabled: false
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      grafana.ini:
        server:
          root_url: https://grafana.${SECRET_DOMAIN}
          domain: grafana.${SECRET_DOMAIN}
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 2Gi
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
        datasources:
          enabled: true
      additionalDataSources:
        - name: Loki (srv-syslog01)
          type: loki
          uid: loki-syslog
          url: http://srv-syslog01.lab.engstrom.live:3100
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 1000
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kube-state-metrics:
      prometheus:
        monitor:
          enabled: true
    prometheus:
      prometheusSpec:
        externalLabels:
          cluster: kubernetes
        enableAdminAPI: true
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        retention: 7d
        retentionSize: 18GB
        walCompression: true
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 200m
            memory: 1536Mi
          limits:
            memory: 3Gi
    prometheus-node-exporter:
      prometheus:
        monitor:
          enabled: true
