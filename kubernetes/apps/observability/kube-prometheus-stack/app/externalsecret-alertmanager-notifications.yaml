---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-notifications
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Raw https://discord.com/api/webhooks/... — Alertmanager discord_configs reads this file.
        discord-webhook-url: "{{ .DISCORD_WEBHOOK_URL }}"
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: observability-notifications/DISCORD_WEBHOOK_URL
