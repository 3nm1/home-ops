---
# Publik DNS via tunnel: *.engstrom.live → external (inte A mot 192.168.20.142).
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: engstrom-live-wildcard
spec:
  endpoints:
    - dnsName: "*.${SECRET_DOMAIN}"
      recordType: CNAME
      targets: ["external.${SECRET_DOMAIN}"]
