---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  chartRef:
    kind: OCIRepository
    name: unpackerr
  interval: 1h
  values:
    controllers:
      unpackerr:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: 0.15.2
            env:
              TZ: Europe/Stockholm
              UN_LOG_LEVEL: info
              UN_WEBSERVER_METRICS: "true"
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local
              UN_SONARR_0_PROTOCOLS: usenet,UsenetDownloadProtocol
              UN_SONARR_0_PATHS_0: /data
              UN_SONARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: SONARR__AUTH__APIKEY
              UN_SONARR_1_URL: http://sonarr4k.media.svc.cluster.local
              UN_SONARR_1_PROTOCOLS: usenet,UsenetDownloadProtocol
              UN_SONARR_1_PATHS_0: /data
              UN_SONARR_1_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr4k-secret
                    key: SONARR__AUTH__APIKEY
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local
              UN_RADARR_0_PROTOCOLS: usenet,UsenetDownloadProtocol
              UN_RADARR_0_PATHS_0: /data
              UN_RADARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: RADARR__AUTH__APIKEY
              UN_RADARR_1_URL: http://radarr4k.media.svc.cluster.local
              UN_RADARR_1_PROTOCOLS: usenet,UsenetDownloadProtocol
              UN_RADARR_1_PATHS_0: /data
              UN_RADARR_1_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr4k-secret
                    key: RADARR__AUTH__APIKEY
              UN_LIDARR_0_URL: http://lidarr.media.svc.cluster.local
              UN_LIDARR_0_PROTOCOLS: usenet,UsenetDownloadProtocol
              UN_LIDARR_0_PATHS_0: /data
              UN_LIDARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: lidarr-secret
                    key: LIDARR__AUTH__APIKEY
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          metrics:
            port: 5656
    serviceMonitor:
      app:
        enabled: true
        endpoints:
          - port: metrics
            path: /metrics
            interval: 30s
    persistence:
      data:
        type: nfs
        server: 192.168.20.20
        path: /mnt/Backup/data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
