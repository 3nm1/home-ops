---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unpackerr-secret
    creationPolicy: Owner
  data:
    - secretKey: METRICS_API_KEY
      remoteRef:
        key: unpackerr/METRICS_API_KEY
