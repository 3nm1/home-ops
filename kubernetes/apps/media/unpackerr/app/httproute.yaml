---
# Standalone route so unpackerr stays reachable even if app-template route rendering fails on upgrade.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unpackerr
spec:
  hostnames: ["unpackerr.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: unpackerr
          port: 5656
