---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apprise
spec:
  chartRef:
    kind: OCIRepository
    name: apprise
  interval: 1h
  values:
    controllers:
      apprise:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-dirs:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - mkdir -p /data/plugin /data/attach
        containers:
          app:
            image:
              repository: caronc/apprise
              tag: v1.5.1
            env:
              TZ: Europe/Stockholm
              APPRISE_STATEFUL_MODE: simple
              APPRISE_ADMIN: "y"
              APPRISE_WORKER_COUNT: "1"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["apprise.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: apprise
        advancedMounts:
          apprise:
            init-dirs:
              - path: /data
      config:
        existingClaim: apprise
        globalMounts:
          - path: /config
      plugin:
        existingClaim: apprise
        globalMounts:
          - path: /plugin
            subPath: plugin
      attach:
        existingClaim: apprise
        globalMounts:
          - path: /attach
            subPath: attach
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp
      run:
        type: emptyDir
        globalMounts:
          - path: /run
